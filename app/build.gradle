plugins {
    id 'com.android.application'
}

def localSigningProperties = new Properties()
def localSigningPropertiesFile = new File(
        new File(System.getProperty('user.home'), '.gradle'),
        'linux-watch-face-signing.properties'
)
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

def signingValue = { String name ->
    providers.environmentVariable(name).orNull ?: localSigningProperties.getProperty(name)
}

def releaseKeystorePath = signingValue('ANDROID_KEYSTORE_PATH')
def releaseVersionCode = providers.environmentVariable('VERSION_CODE').orElse('2').get().toInteger()
def releaseVersionName = providers.environmentVariable('VERSION_NAME').orElse('2.0.0').get()

android {
    namespace = 'tech.cyang.linuxwatchface'
    compileSdk = 35
    enableKotlin = false

    defaultConfig {
        applicationId = 'tech.cyang.linuxwatchface'
        minSdk = 34
        targetSdk = 35
        versionCode = releaseVersionCode
        versionName = releaseVersionName
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = signingValue('ANDROID_KEYSTORE_PASSWORD')
                keyAlias = signingValue('ANDROID_KEY_ALIAS')
                keyPassword = signingValue('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = true
        }
        release {
            minifyEnabled = true
            shrinkResources = false

            if (releaseKeystorePath) {
                signingConfig = signingConfigs.release
            }
        }
    }
}
