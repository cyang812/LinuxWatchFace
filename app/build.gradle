plugins {
    id 'com.android.application'
}

def releaseKeystorePath = providers.environmentVariable('ANDROID_KEYSTORE_PATH').orNull
def releaseVersionCode = providers.environmentVariable('VERSION_CODE').orElse('2').get().toInteger()
def releaseVersionName = providers.environmentVariable('VERSION_NAME').orElse('2.0.0').get()

android {
    namespace = 'tech.cyang.linuxwatchface'
    compileSdk = 35
    enableKotlin = false

    defaultConfig {
        applicationId = 'tech.cyang.linuxwatchface'
        minSdk = 34
        targetSdk = 35
        versionCode = releaseVersionCode
        versionName = releaseVersionName
    }

    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile = file(releaseKeystorePath)
                storePassword = providers.environmentVariable('ANDROID_KEYSTORE_PASSWORD').get()
                keyAlias = providers.environmentVariable('ANDROID_KEY_ALIAS').get()
                keyPassword = providers.environmentVariable('ANDROID_KEY_PASSWORD').get()
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled = true
        }
        release {
            minifyEnabled = true
            shrinkResources = false

            if (releaseKeystorePath) {
                signingConfig = signingConfigs.release
            }
        }
    }
}
